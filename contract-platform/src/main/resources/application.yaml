platform:
  s3:
    endpoint: http://localhost:9000
    bucket: specs
    access-key: platform
    secret-key: platform123
server:
  port: 8081

s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  access-key: ${S3_ACCESS_KEY:platform}
  secret-key: ${S3_SECRET_KEY:platform123}
  bucket: ${S3_BUCKET:specs}
  region: ${S3_REGION:us-east-1}

spring:
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-haiku-4-5-20251001
          max-tokens: 1500
          temperature: 0.2