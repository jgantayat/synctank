platform:
  s3:
    endpoint: http://localhost:9000
    bucket: specs
    access-key: platform
    secret-key: platform123
  radar:
    escalation-calls-per-day: ${RADAR_ESCALATION_THRESHOLD:5000}

server:
  port: 8081

s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  access-key: ${S3_ACCESS_KEY:platform}
  secret-key: ${S3_SECRET_KEY:platform123}
  bucket: ${S3_BUCKET:specs}
  region: ${S3_REGION:us-east-1}

spring:
  # Day 06 — client registry store. Port 5433 (not 5432) because docker-compose remaps it
  # to avoid the Day-01 clash with a locally installed Postgres.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/contract_platform}
    username: ${DB_USER:platform}
    password: ${DB_PASSWORD:platform123}
  jpa:
    hibernate:
      ddl-auto: update
    # Hibernate manages the schema for now; Flyway lands in Phase 7 (see §2.1).
    open-in-view: false
    # open-in-view=false is deliberate: it means a LazyInitializationException surfaces
    # in development rather than being silently papered over by a request-scoped session.
    # Every association the radar reads is therefore mapped EAGER on purpose.
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-haiku-4-5-20251001
          max-tokens: 1500
          temperature: 0.2