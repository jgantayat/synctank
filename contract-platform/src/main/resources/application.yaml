platform:
  # ---------- Day 09 — secrets ----------
  # provider=env : credentials come from environment variables and the defaults below. Nothing
  #                is fetched, no AWS call is made, behaviour is byte-identical to Day 08. This
  #                is what CI runs, and what any machine without AWS access runs.
  # provider=aws : one JSON secret is read from AWS Secrets Manager before any bean is created,
  #                and its values override everything below. A failure here fails startup —
  #                booting on the defaults would defeat the point.
  secrets:
    provider: ${SECRETS_PROVIDER:env}
    secret-id: ${SECRETS_ID:synctank/platform}
    region: ${AWS_REGION:us-east-1}
    # Blank against real AWS. Point at LocalStack (http://localhost:4566) to rehearse the whole
    # mechanism with no AWS account — the same trick MinIO plays for S3.
    endpoint: ${SECRETS_ENDPOINT:}

  # ---------- Day 09 (F1) — ONE S3 tree ----------
  # There used to be a second, top-level `s3:` block. S3Config and BucketInitializer read that
  # one; SpecStore read this one, and only its bucket. The credentials here were dead — editing
  # them changed nothing — and the two bucket names could diverge the moment S3_BUCKET was set.
  # Env-var names are unchanged so .github/workflows/contract.yml needs no edit.
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket: ${S3_BUCKET:specs}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:platform}
    secret-key: ${S3_SECRET_KEY:platform123}
  # ---------- Day 10 (F3/F4) — the MinIO assumptions become switches ----------
  # Every default below is Day 09's behaviour; CI and local runs change nothing.
  # On AWS (infra/aws/ecs/contract-platform-task-definition.json): S3_AUTH=iam,
  # S3_PATH_STYLE=false, S3_CREATE_BUCKET=false and S3_ENDPOINT="" — the task role grants
  # access, no key pair exists, and the bucket is provisioned infrastructure.
    auth: ${S3_AUTH:static}
    path-style: ${S3_PATH_STYLE:true}
    create-bucket-if-missing: ${S3_CREATE_BUCKET:true}
  # Day 10 (F1) — the executable UsageScanner runs. Always `rg` in practice; configurable so the
  # "scanner unavailable" path can be exercised on purpose (guide §8.9) rather than by accident.
  usage-scanner:
    binary: ${USAGE_SCANNER_BINARY:rg}
  radar:
    escalation-calls-per-day: ${RADAR_ESCALATION_THRESHOLD:5000}

  # Day 11 (F5) — the AI spend guardrail. This platform calls api.anthropic.com directly,
  # not Bedrock, so no AWS cost alarm can see this spend: the cap has to live in-process.
  # 200/day is roughly 40x a heavy demo day and about $1 at the estimate below — generous
  # enough never to fire by accident, low enough that a stuck retry loop stops in minutes.
  ai:
    daily-call-limit: ${AI_DAILY_CALL_LIMIT:200}
    estimated-cost-per-call-usd: ${AI_COST_PER_CALL_USD:0.005}

  # Day 07 — Contract Agent (Phase 6). Every guardrail that is configuration lives here.
  agent:
    enabled: ${AGENT_ENABLED:true}
    github-api: https://api.github.com
    repo-owner: jgantayat
    repo-name: synctank
    # NEVER written to. GitHubClient hard-refuses a commit targeting this branch.
    base-branch: main
    branch-prefix: agent/
    source-dir: orders-backend/src/main/java/com/synctank/orders/api
    allowed-path-prefix: orders-backend/src/main/java/com/synctank/orders/api/
    spec-repo-key: orders-backend
    # Blank default is deliberate. Day 05's lesson: an unresolvable ${PLACEHOLDER} with no
    # default fails context startup, which made `mvn test` fail for a reason unrelated to the
    # test. Blank here means draft-only: drafts work, /approve returns 409. Day 09 overrides
    # this from Secrets Manager when provider=aws.
    github-token: ${GITHUB_TOKEN:}
    dashboard-origins: ${AGENT_DASHBOARD_ORIGINS:http://localhost:4200}

server:
  port: 8081
  # Day 11 (F6) — Spring's default is `immediate`, which drops in-flight requests the
  # instant SIGTERM lands. The Dockerfile already puts the JVM at PID 1 so it RECEIVES the
  # signal, and the ECS task definition already allows 30s to act on it; without this line
  # both of those did nothing. An agent draft takes 3-8s and a /report call up to 60, so a
  # deploy at the wrong moment was a failed request on someone's screen.
  shutdown: graceful

spring:
  # Day 11 — how long graceful shutdown waits for in-flight work before forcing it.
  # Below the task definition's stopTimeout of 30s on purpose: Spring must finish first,
  # or ECS SIGKILLs mid-drain and the graceful setting above is decorative.
  lifecycle:
    timeout-per-shutdown-phase: 25s
  # Day 06 — client registry store. Port 5433 (not 5432): docker-compose remaps it to avoid
  # the Day-01 clash with a locally installed Postgres.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/contract_platform}
    username: ${DB_USER:platform}
    # Day 09 (F4) — the fourth credential. Overridden from Secrets Manager when provider=aws.
    password: ${DB_PASSWORD:platform123}
    hikari:
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    # Hibernate manages the schema for now; Flyway lands in Phase 7 (Day 06 §2.1).
    open-in-view: false
    # open-in-view=false is deliberate: a LazyInitializationException surfaces in development
    # rather than being papered over by a request-scoped session. Every association the radar
    # reads is therefore mapped EAGER on purpose.
  ai:
    anthropic:
      # Day 09 (F3) — this used to be a bare ${ANTHROPIC_API_KEY} with no default, so the whole
      # platform refused to start without it: spec store, diff engine, severity classifier and
      # Impact Radar all taken down by a missing narration key. ChangeReportService already
      # catches a failing AI call and falls back to a deterministic report precisely so an AI
      # outage cannot fail CI; the startup hard-fail sat in front of that and defeated it.
      # A non-blank placeholder keeps Spring AI's autoconfiguration happy and pushes the failure
      # to where it belongs — the call site, which already handles it.
      api-key: ${ANTHROPIC_API_KEY:not-configured}
      chat:
        options:
          model: claude-haiku-4-5-20251001
          max-tokens: 1500
          temperature: 0.2