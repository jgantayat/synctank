# Day 06 — NOTE: a test-classpath application.yaml REPLACES the main one entirely
# (test-classes precede classes on the classpath); it does not merge with it.
# Every property the context needs at startup must be repeated here.
#
# Without this file, `mvn test` fails two ways: no DataSource for the JPA layer, and an
# unresolvable ${ANTHROPIC_API_KEY} placeholder (that one predates Day 06 — the context test
# has quietly required the env var since Day 05).
#
# Day 07 adds platform.agent for the same reason. enabled:false and a blank token mean a
# stray @SpringBootTest can never reach api.github.com.
#
# Day 09 adds platform.secrets (provider:env — a test must never make an AWS call) and
# platform.s3.region, which S3Config now reads off S3Props. The old top-level s3: block is
# gone; leaving it would recreate the two-trees confusion this day removed.

spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:radar;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  ai:
    anthropic:
      api-key: test-key-never-called

platform:
  secrets:
    provider: env
    secret-id: not-used-in-tests
    region: us-east-1
    endpoint: ""
  s3:
    endpoint: http://localhost:9000
    bucket: specs
    region: us-east-1
    access-key: test
    secret-key: test
  radar:
    escalation-calls-per-day: 5000
  agent:
    enabled: false
    github-api: https://api.github.com
    repo-owner: test-owner
    repo-name: test-repo
    base-branch: main
    branch-prefix: agent/
    source-dir: orders-backend/src/main/java/com/synctank/orders/api
    allowed-path-prefix: orders-backend/src/main/java/com/synctank/orders/api/
    spec-repo-key: orders-backend
    github-token: ""
    dashboard-origins: http://localhost:4200