name: Contract Spec Pipeline

on:
  pull_request:
    branches: [main]
    # Day 12 — labeled/unlabeled so that adding or removing `contract:breaking-approved`
    # re-evaluates the gate. Every label event re-runs the WHOLE job on purpose: a job skipped
    # by an `if:` reports as passing to branch protection, so filtering by label name here
    # would let any unrelated label turn a red required check green.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

# A newer push to the same PR cancels the older run — saves minutes and confusion
concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

# contents: write   — "Commit baseline file to repo" pushes to main
# pull-requests: write — the contract-check action posts (and updates) its report comment
permissions:
  contents: write
  pull-requests: write

jobs:
  spec-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout synctank
        uses: actions/checkout@v5

      # orders-backend needs Java to generate its spec, orders-frontend needs Node to compile
      # against it. contract-platform's own Java, ripgrep, MinIO and Postgres are the Day 12
      # action's business now, not this workflow's.
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: orders-frontend/package-lock.json

      - name: Generate OpenAPI spec
        working-directory: orders-backend
        run: mvn -q verify

      - name: Regenerate frontend client from candidate spec
        working-directory: orders-frontend
        run: |
          npm ci
          npm run generate:api

      # Level 1 — the compile-time contract check. A breaking change fails HERE, with the file
      # and line of every broken use site. That is the product's first promise, and the action
      # below does not replace it.
      - name: Build frontend against candidate contract
        working-directory: orders-frontend
        run: npm run build

      # ---------- Day 12: Levels 1-2 as one reusable step ----------
      # Everything that used to be eleven inline steps (start MinIO + Postgres, build and start
      # contract-platform, seed the registry, seed telemetry, diff, report, comment, three gates,
      # two artifacts) is now .github/actions/contract-check. A second team adopts the same
      # thing with `uses: jgantayat/synctank/.github/actions/contract-check@v1`.
      #
      # !cancelled(), not always(): runs when the frontend build FAILED (a breaking change is
      # exactly when the blast radius matters most — the Day 05 lesson), but not when a newer
      # push cancelled this run.
      - name: Contract check
        id: contract
        if: ${{ !cancelled() }}
        uses: ./.github/actions/contract-check
        with:
          candidate-spec: orders-backend/target/openapi.json
          baseline-spec: orders-backend/contract/openapi.baseline.json
          spec-key: orders-backend
          frontend-src: orders-frontend/src
          consumer-app-name: customer-portal
          consumer-team: Team Checkout
          # SEEDED, NOT MEASURED — the PR comment says so. Phase 5's interceptor is not built.
          demo-telemetry: '{"GET /api/orders/{id}": 12000, "GET /api/orders": 3400, "POST /api/orders": 800}'
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Default, stated for the reader: fail PRs only. Failing a push to main skipped the
          # baseline commit below and wedged every later PR (Day 12 F2).
          fail-on-breaking: pull-request

      # ---------- main-branch-only ----------
      # "Publish baseline" (PUT /specs/.../baseline) is gone: it wrote to a MinIO container that
      # was destroyed with the runner seconds later (Day 12 F6). The committed file below has
      # always been the real baseline — it is what the next PR diffs against.
      - name: Commit baseline file to repo (main only)
        if: github.event_name == 'push'
        run: |
          mkdir -p orders-backend/contract
          cp orders-backend/target/openapi.json orders-backend/contract/openapi.baseline.json
          if [ -z "$(git status --porcelain orders-backend/contract/)" ]; then
            echo "Baseline unchanged — nothing to commit"; exit 0
          fi
          git config user.name  "synctank-ci"
          git config user.email "synctank-ci@users.noreply.github.com"
          git add orders-backend/contract/openapi.baseline.json
          git commit -m "chore: publish contract baseline for ${GITHUB_SHA} [skip ci]"
          git push

  # ---------- Day 10: the contract-platform image ----------
  # A second, independent job — it runs in parallel with spec-pipeline and shares nothing with
  # it, so the contract gate above behaves exactly as it did on Day 09.
  #
  # Two things this proves on every PR:
  #   1. The Dockerfile still builds. Day 11 deploys this image; a Dockerfile that only ever
  #      built on one laptop is not a deployment artifact.
  #   2. contract-platform's unit tests pass. The build stage runs `mvn package` WITHOUT
  #      -DskipTests, and spec-pipeline's own build step above has always skipped them — so
  #      until today no contract-platform test had ever run in CI (audit finding F5).
  #
  # Nothing is pushed. Pushing to ECR is Day 11, with OIDC rather than stored AWS keys.
  platform-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # least privilege: this job reads the repo and nothing else

    steps:
      - name: Checkout synctank
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build contract-platform image (runs unit tests inside the build)
        uses: docker/build-push-action@v6
        with:
          context: contract-platform
          file: contract-platform/Dockerfile
          push: false
          load: true
          tags: synctank/contract-platform:ci
          cache-from: type=gha,scope=contract-platform
          cache-to: type=gha,mode=max,scope=contract-platform

      - name: Smoke-test the image
        run: |
          IMAGE=synctank/contract-platform:ci

          # Runs as the unprivileged uid baked into the image, not root.
          RUN_UID=$(docker run --rm --entrypoint id "$IMAGE" -u)
          echo "Container uid: $RUN_UID"
          [ "$RUN_UID" = "10001" ] || { echo "::error::image runs as uid $RUN_UID, expected 10001"; exit 1; }

          # F1: the usage scanner's binary is present and executable for that user.
          docker run --rm --entrypoint rg "$IMAGE" --version | head -1

          # The health-check tool is present.
          docker run --rm --entrypoint curl "$IMAGE" --version | head -1

          # Image size, for the record — trend it, don't gate on it.
          docker image inspect "$IMAGE" --format 'Image size: {{.Size}} bytes'